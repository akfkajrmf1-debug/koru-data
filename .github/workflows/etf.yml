name: fetch etf daily

# 미국장 마감 후 1회만 실행한다. stooq에 15분마다 때리지 않기 위해 분리했다.
# 22:00 UTC = 07:00 KST — 한국장 개장 2시간 전에 전일 확정 일봉이 준비된다.
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  etf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_etf.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/
          git diff --staged --quiet || (git commit -m "etf daily update" && git push)
