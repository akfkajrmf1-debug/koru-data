name: fetch market data

on:
  schedule:
    # UTC 기준. 한국시간 = UTC + 9
    # 한국장(08-16 KST) 및 미국 프리마켓~정규장(21 KST ~ 05 KST) 커버
    - cron: "*/15 23,0,1,2,3,4,5,6,7,12,13,14,15,16,17,18,19,20 * * 0-5"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch candles
        run: python scripts/fetch.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
